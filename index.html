<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JawsLand — Космический Сервер Майнкрафт</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Космические частицы на фоне -->
    <div class="stars"></div>
    <div class="twinkling"></div>

    <!-- Шапка сайта (Неоновый Хедер) -->
    <header>
        <div class="logo">Jaws<span>Land</span></div>
        <nav>
            <a href="#about">О сервере</a>
            <a href="#rules">Правила</a>
            <a href="#donate" class="nav-donate">Донат</a>
        </nav>
    </header>

    <!-- Главная страница -->
    <main>
        <section class="hero">
            <div class="hero-content">
                <h1 class="neon-title">Добро пожаловать на <br><span class="server-name">JawsLand</span></h1>
                <p class="subtitle">Уникальное выживание в бескрайней неоновой галактике.</p>
                
                <!-- Блок с IP адресом -->
                <div class="ip-block">
                    <div class="ip-text-group">
                        <span class="ip-label">АЙПИ СЕРВЕРА</span>
                        <strong id="server-ip">JawsLand.com</strong>
                    </div>
                    <button class="neon-btn" onclick="copyIP()">КОПИРОВАТЬ</button>
                </div>
                
                <!-- Блок онлайна -->
                <div class="online-block">
                    <div class="pulse-dot"></div>
                    <span>В космосе сейчас: </span>
                    <strong id="player-count">Загрузка...</strong>
                </div>
            </div>
        </section>
    </main>

    <!-- Скрипт для копирования IP и вывода реального онлайна -->
    <script>
        // Новый международный домен вашего сервера
        const SERVER_IP = "JawsLand.com"; 

        function copyIP() {
            const ipText = document.getElementById('server-ip').innerText;
            navigator.clipboard.writeText(ipText);
            alert('🚀 Космический IP JawsLand.com скопирован!');
        }

        async function updateOnline() {
            try {
                const response = await fetch(`https://mcsrvstat.us{SERVER_IP}`);
                const data = await response.json();
                
                const onlineText = document.getElementById('player-count');
                const pulseDot = document.querySelector('.pulse-dot');
                
                if (data.online === true) {
                    onlineText.innerHTML = `${data.players.online} / ${data.players.max}`;
                    onlineText.style.color = "#00ffcc"; /* Неоновый бирюзовый */
                    pulseDot.style.background = "#00ffcc";
                    pulseDot.style.boxShadow = "0 0 10px #00ffcc";
                } else {
                    onlineText.innerHTML = "ОФЛАЙН";
                    onlineText.style.color = "#ff0055"; /* Неоновый розовый */
                    pulseDot.style.background = "#ff0055";
                    pulseDot.style.boxShadow = "0 0 10px #ff0055";
                }
            } catch (error) {
                console.error("Ошибка подключения к API:", error);
                document.getElementById('player-count').innerHTML = "ОШИБКА";
            }
        }

        updateOnline();
        setInterval(updateOnline, 30000);
    </script>
</body>
</html>
